<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Progress Tracker</title>
    <style>
        :root {
            /* Light Theme - Prestigious & Minimal */
            --bg-color: #fdfdfc;
            --surface-color: #ffffff;
            --text-primary: #1c1917;
            --text-secondary: #78716c;
            --accent-color: #0f766e; /* Sophisticated Teal */
            --accent-hover: #115e59;
            --border-color: #e7e5e4;
            --progress-bg: #f5f5f4;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --header-bg: rgba(253, 253, 252, 0.9);
        }

        [data-theme="dark"] {
            /* Dark Theme - Deep Slate & Emerald */
            --bg-color: #0c0a09;
            --surface-color: #1c1917;
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --accent-color: #2dd4bf; 
            --accent-hover: #14b8a6;
            --border-color: #292524;
            --progress-bg: #292524;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            --header-bg: rgba(12, 10, 9, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
        }

        button {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        button.primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
        }

        [data-theme="dark"] button.primary {
            color: #0c0a09;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        /* Progress Bar */
        .progress-container {
            max-width: 900px;
            margin: 1.5rem auto 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background-color: var(--progress-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Main Content */
        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-item {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-item.completed .task-title {
            color: var(--text-secondary);
            text-decoration: line-through;
            text-decoration-color: var(--text-secondary);
        }

        .task-main {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        /* Custom Checkbox */
        .checkbox-wrapper {
            position: relative;
            margin-top: 0.25rem;
        }

        .checkbox-wrapper input[type="checkbox"] {
            opacity: 0;
            position: absolute;
            width: 0;
            height: 0;
        }

        .custom-checkbox {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 9px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        [data-theme="dark"] .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox::after {
            border-color: #0c0a09;
        }

        .task-title {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .toggle-notes-btn {
            background: none;
            border: none;
            box-shadow: none;
            color: var(--text-secondary);
            padding: 0;
            font-size: 0.875rem;
        }
        
        .toggle-notes-btn:hover {
            color: var(--accent-color);
            background: none;
        }

        /* Details / Notes Section */
        .task-details {
            display: none;
            margin-left: 2.25rem;
            margin-top: 0.5rem;
        }

        .task-details.active {
            display: block;
        }

        textarea {
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: inherit;
            font-size: 0.875rem;
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Hidden File Input */
        #import-file {
            display: none;
        }

        @media (max-width: 600px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            .controls {
                width: 100%;
                justify-content: space-between;
            }
            main {
                padding: 0 1rem;
            }
        }
    </style>
</head>

    </header>

        let state = {};
        const STORAGE_KEY = 'master_tracker_state';

        // Load state from local storage
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch (e) {
                    console.error("Failed to parse stored state");
                    initState();
                }
            } else {
                initState();
            }
        }

        // Initialize empty state
        function initState() {
            state = {
                theme: 'dark',
                tasks: {}
            };
            rawTasks.forEach((_, index) => {
                state.tasks[index] = {
                    completed: false,
                    notes: ''
                };
            });
        }

        // Save state to local storage
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateProgress();
        }

        // Render the UI
        function renderTasks() {
            const listContainer = document.getElementById('task-list');
            listContainer.innerHTML = '';

            rawTasks.forEach((taskName, index) => {
                const taskData = state.tasks[index] || { completed: false, notes: '' };
                
                const itemDiv = document.createElement('div');
                itemDiv.className = `task-item ${taskData.completed ? 'completed' : ''}`;
                itemDiv.id = `task-${index}`;

                itemDiv.innerHTML = `
                    <div class="task-main">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" ${taskData.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                            <span class="custom-checkbox"></span>
                        </label>
                        <div class="task-title" onclick="toggleTask(${index})">${taskName}</div>
                        <button class="toggle-notes-btn" onclick="toggleNotes(${index})">
                            ${taskData.notes.trim() ? '📝 Edit Note' : '➕ Add Note'}
                        </button>
                    </div>
                    <div class="task-details" id="notes-${index}">
                        <textarea placeholder="Add details, links, or context here..." oninput="updateNotes(${index}, this.value)">${taskData.notes}</textarea>
                    </div>
                `;

                listContainer.appendChild(itemDiv);
            });
            updateProgress();
        }

        // Interactions
        window.toggleTask = function(index) {
            state.tasks[index].completed = !state.tasks[index].completed;
            const itemDiv = document.getElementById(`task-${index}`);
            const checkbox = itemDiv.querySelector('input[type="checkbox"]');
            
            checkbox.checked = state.tasks[index].completed;
            if (state.tasks[index].completed) {
                itemDiv.classList.add('completed');
            } else {
                itemDiv.classList.remove('completed');
            }
            saveState();
        };

        window.toggleNotes = function(index) {
            const notesDiv = document.getElementById(`notes-${index}`);
            notesDiv.classList.toggle('active');
        };

        window.updateNotes = function(index, value) {
            state.tasks[index].notes = value;
            
            // Update button text passively
            const btn = document.querySelector(`#task-${index} .toggle-notes-btn`);
            if (value.trim()) {
                btn.innerText = '📝 Edit Note';
            } else {
                btn.innerText = '➕ Add Note';
            }
            
            saveState();
        };

        // Progress Calculation
        function updateProgress() {
            const total = rawTasks.length;
            let completed = 0;
            for (let key in state.tasks) {
                if (state.tasks[key].completed) completed++;
            }

            const percentage = Math.round((completed / total) * 100);
            
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${completed} / ${total} (${percentage}%)`;
        }

        // Theme Toggle
        window.toggleTheme = function() {
            const current = document.body.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            state.theme = newTheme;
            saveState();
        };

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').innerText = '☀️ Light Mode';
            } else {
                document.body.removeAttribute('data-theme');
                document.getElementById('theme-btn').innerText = '🌙 Dark Mode';
            }
        }

            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "progress-backup.json");
            dlAnchorElem.click();
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState.tasks) {
                        state = importedState;
                        saveState();
                        applyTheme(state.theme);
                        renderTasks();
                        alert('Progress successfully imported!');
                    } else {
                        alert('Invalid file format.');
                    }
                } catch (err) {
                    alert('Error parsing JSON file.');
                }
                // Reset file input
                event.target.value = '';
            };
            reader.readAsText(file);
        };

        // Boot up
        loadState();
        applyTheme(state.theme || 'dark');
        renderTasks();

    </script>
</body>
</html>
